name: CI

# Runs on every push and pull request, so regressions surface before a release
# rather than during one.
# The repository default for workflow tokens is write; nothing here needs to
# write, so it is narrowed to read for every job.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_datasets:
        description: "Also validate against the full-size crc32 dataset (~212 MiB of Git LFS traffic)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # pyarrow is an optional accelerator that replaces the whole loading
          # path, so both configurations must produce identical output. The
          # Docker image ships with it, plain pip/conda installs do not.
          # numba is optional (needed only for --gpu), so it gets its own leg:
          # without it 18 tests skip, and that must not be the only thing CI runs.
          - python: "3.13"
            pyarrow: true
            numba: true
          - python: "3.13"
            pyarrow: false
            numba: true
          - python: "3.13"
            pyarrow: true
            numba: false
          - python: "3.11"
            pyarrow: false
            numba: false
    name: py${{ matrix.python }}${{ matrix.pyarrow && ' + pyarrow' || '' }}${{ matrix.numba && ' + numba' || '' }}
    steps:
      # Git LFS is deliberately not fetched by default. The crc32 dataset and its
      # reference matrices total ~333 MiB, which every job of this matrix would
      # download on every push, exhausting the 1 GiB/month LFS bandwidth quota
      # immediately. The regression tests skip those files and still cover the
      # same code paths via boring/chewie/100. The full-size dataset is always
      # validated at release time, and on demand via the full_datasets input.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fetch full-size reference datasets from Git LFS
        if: inputs.full_datasets
        run: |
          git lfs install
          git lfs pull --include="test/crc32.tab,validation/crc32_c.tab,validation/crc32_py.tab"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest

      - name: Install numba
        if: matrix.numba
        run: pip install -r requirements-gpu.txt

      # pyarrow ships in requirements.txt, but the pandas fallback is still a
      # supported configuration (the loader probes for pyarrow at runtime), so
      # one leg of the matrix removes it again to keep that path covered.
      - name: Remove pyarrow to exercise the pandas fallback
        if: '!matrix.pyarrow'
        run: |
          pip uninstall -y pyarrow
          python -c "import pyarrow" && exit 1 || echo "pyarrow absent as intended"

      - name: Run test suite
        run: pytest test/ -v

  docker:
    # Build and exercise the image on every change, so a broken Dockerfile is
    # caught here instead of halfway through a release.
    runs-on: ubuntu-latest
    steps:
      # No LFS needed: the smoke tests use the small boring.tab dataset.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Required for the GHA cache backend: the default docker driver cannot
      # export a build cache.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: cgmlst-dists-py:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: test/smoke_image.sh cgmlst-dists-py:ci
