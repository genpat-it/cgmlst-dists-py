name: Test and Publish Docker

on:
  release:
    types: [published]

# Read-only by default; the docker job widens this to packages: write for the
# registry push, and nothing else.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Credentials are deliberately kept here: the Git LFS fetch below needs
      # them, and dropping them would only surface as a failed release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Fetch only the three LFS objects the regression tests need (~212 MiB)
      # rather than every LFS file in the repo (~333 MiB). A release should be
      # validated against the full-size dataset, but not at the cost of the
      # monthly LFS bandwidth quota.
      - name: Fetch reference datasets from Git LFS
        run: |
          git lfs install
          git lfs pull --include="test/crc32.tab,validation/crc32_c.tab,validation/crc32_py.tab"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        # pyarrow is included because the published image ships with it, so the
        # release is tested in the same configuration users will run.
        run: pip install -r requirements.txt pytest pyarrow

      - name: Run test suite
        run: pytest test/ -v

      - name: Verify the full-size dataset was actually validated
        # If the LFS pull silently failed, the crc32 regression tests would skip
        # and the release would look green without having been checked against
        # the large dataset.
        run: |
          set -euo pipefail
          pytest test/ -q -k "crc32" --no-header -rs > result.txt 2>&1 || true
          cat result.txt
          if grep -qE "skipped" result.txt; then
            echo "::error::crc32 regression tests skipped; Git LFS objects were not fetched"
            exit 1
          fi

      - name: Check that the reported version matches the tag
        # The Bioconda recipe tests `--version | grep <tag>`, so a mismatch
        # between VERSION and the release tag breaks the package build.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          reported="$(python cgmlst-dists.py --version)"
          echo "tag=$tag reported=$reported"
          [ "$tag" = "$reported" ]

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Required for the GHA cache backend: the default docker driver cannot
      # export a build cache.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Build first and load it locally, so the image is exercised before it is
      # published. Pushing an image that cannot run is the one failure mode a
      # release must not have.
      - name: Build image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: cgmlst-dists-py:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # The expected version is the release tag, so an image reporting the
        # wrong version can never be published.
        run: test/smoke_image.sh cgmlst-dists-py:candidate "${GITHUB_REF_NAME#v}"

      - name: Push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
