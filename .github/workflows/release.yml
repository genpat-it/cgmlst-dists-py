name: Test and Publish Docker

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # reference matrices for the regression tests

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        # pyarrow is included because the published image ships with it, so the
        # release is tested in the same configuration users will run.
        run: pip install -r requirements.txt pytest pyarrow

      - name: Run test suite
        run: pytest test/ -v

      - name: Check that the reported version matches the tag
        # The Bioconda recipe tests `--version | grep <tag>`, so a mismatch
        # between VERSION and the release tag breaks the package build.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          reported="$(python cgmlst-dists.py --version)"
          echo "tag=$tag reported=$reported"
          [ "$tag" = "$reported" ]

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Build first and load it locally, so the image is exercised before it is
      # published. Pushing an image that cannot run is the one failure mode a
      # release must not have.
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: cgmlst-dists-py:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -euo pipefail

          # The reported version must match the release tag.
          tag="${GITHUB_REF_NAME#v}"
          [ "$(docker run --rm cgmlst-dists-py:candidate --version)" = "$tag" ]

          # Output must be byte-identical to the C implementation's matrix.
          docker run --rm -v "$PWD":/data:ro cgmlst-dists-py:candidate \
            -i /data/test/boring.tab -c -s | diff - validation/boring_c.tab

          # Containers are frequently run with an arbitrary UID; numba's cache
          # directory has broken this before, so it is checked explicitly.
          docker run --rm -u 12345:12345 -v "$PWD":/data:ro cgmlst-dists-py:candidate \
            -i /data/test/boring.tab -c -s | diff - validation/boring_c.tab

          # Every missing-data handler must run inside the image.
          for y in 0 1 2 3; do
            docker run --rm -v "$PWD":/data:ro cgmlst-dists-py:candidate \
              -i /data/test/boring.tab -c -s -y "$y" > /dev/null
          done

          # The image bundles pyarrow, so the Arrow loader must be the one used.
          docker run --rm -v "$PWD":/data:ro cgmlst-dists-py:candidate \
            -i /data/test/boring.tab -c 2>&1 | grep -q "Arrow fast path"

          echo "Image smoke tests passed"

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
